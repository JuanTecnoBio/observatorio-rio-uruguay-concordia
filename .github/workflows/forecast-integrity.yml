name: Integridad del pronóstico
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_*.py'
      - '.github/workflows/forecast-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
