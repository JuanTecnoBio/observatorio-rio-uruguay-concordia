name: Actualizar datos y publicar

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.paths.outputs.base_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-update.txt

      - name: Instalar adaptadores de datos
        run: pip install -r scripts/requirements-update.txt

      - name: Preparar el histórico inicial de la red CTM
        run: |
          if [[ ! -f public/data/hydrometric_history.json ]]; then
            python scripts/backfill_ctm_history.py --start-year 2017 --workers 8
          fi

      - name: Consultar fuentes oficiales
        run: python scripts/update_data.py

      - name: Guardar el nuevo corte
        run: |
          if git diff --quiet -- public/data/current_state.json public/data/risk_reports.json public/data/hydrometric_history.json public/data/flow_forecast_archive.json; then
            exit 0
          fi
          git config user.name "observatorio-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/current_state.json public/data/risk_reports.json public/data/hydrometric_history.json public/data/flow_forecast_archive.json
          git commit -m "datos: actualizar corte automático"
          git push

      - id: paths
        name: Resolver ruta pública
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository_name}" == *.github.io ]]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${repository_name}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar aplicación
        run: npm ci

      - name: Generar sitio estático
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          PAGES_BASE_PATH: ${{ steps.paths.outputs.base_path }}
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
